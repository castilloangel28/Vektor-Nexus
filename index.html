<!-- ========================================== -->
<!-- MÓDULO CALCULADORA PREMIUM - DRAGON BALL NEON -->
<!-- ========================================== -->
<style>
  :root {
    --neon-blue: #00f3ff;
    --neon-red: #ff003c;
    --dark-bg: #050505;
  }

  body.dbz-theme {
    background-color: var(--dark-bg);
    /* Fondo en línea de Goku UI Neon */
    background-image: linear-gradient(rgba(5, 5, 5, 0.85), rgba(5, 5, 5, 0.85)), url('https://images3.alphacoders.com/132/1329241.png');
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    color: #ffffff;
    font-family: 'Courier New', Courier, monospace;
    margin: 0;
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .cyber-panel {
    background: rgba(0, 0, 0, 0.7);
    border: 2px solid var(--neon-blue);
    box-shadow: 0 0 15px var(--neon-blue), inset 0 0 15px var(--neon-blue);
    border-radius: 10px;
    padding: 30px;
    width: 100%;
    max-width: 450px;
    margin-bottom: 20px;
    text-align: center;
    backdrop-filter: blur(5px);
  }

  .cyber-panel.rojo {
    border-color: var(--neon-red);
    box-shadow: 0 0 15px var(--neon-red), inset 0 0 15px var(--neon-red);
  }

  h2 {
    text-transform: uppercase;
    text-shadow: 0 0 8px var(--neon-blue);
    margin-bottom: 20px;
  }

  .cyber-panel.rojo h2 {
    text-shadow: 0 0 8px var(--neon-red);
  }

  .cyber-input {
    width: 90%;
    padding: 10px;
    margin: 10px 0;
    background: transparent;
    border: 1px solid var(--neon-blue);
    color: var(--neon-blue);
    font-size: 16px;
    outline: none;
    box-shadow: 0 0 5px var(--neon-blue);
  }
  
  .cyber-panel.rojo .cyber-input {
    border-color: var(--neon-red);
    color: #fff;
    box-shadow: 0 0 5px var(--neon-red);
  }

  .cyber-btn {
    background: transparent;
    color: #fff;
    border: 2px solid var(--neon-blue);
    padding: 12px 25px;
    font-size: 16px;
    text-transform: uppercase;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
    text-shadow: 0 0 5px var(--neon-blue);
    box-shadow: 0 0 10px var(--neon-blue);
    margin-top: 15px;
  }

  .cyber-btn:hover {
    background: var(--neon-blue);
    color: #000;
    box-shadow: 0 0 20px var(--neon-blue);
  }

  .cyber-panel.rojo .cyber-btn {
    border-color: var(--neon-red);
    text-shadow: 0 0 5px var(--neon-red);
    box-shadow: 0 0 10px var(--neon-red);
  }

  .cyber-panel.rojo .cyber-btn:hover {
    background: var(--neon-red);
    box-shadow: 0 0 20px var(--neon-red);
  }

  #resultadoEficiencia {
    font-size: 2em;
    font-weight: bold;
    margin-top: 20px;
    color: var(--neon-blue);
    text-shadow: 0 0 15px var(--neon-blue);
  }
</style>

<!-- CONTENEDOR DE LA APLICACIÓN -->
<div class="dbz-theme">

  <!-- Módulo 1: Autenticación -->
  <div id="panelAuth" class="cyber-panel">
    <h2>Sistema de Acceso</h2>
    <input type="text" id="inpToken" class="cyber-input" placeholder="INGRESE TOKEN (EJ: TK-140544)">
    <input type="password" id="inpPin" class="cyber-input" placeholder="INGRESE PIN">
    <button class="cyber-btn" onclick="iniciarSesion()">Desbloquear Terminal</button>
    <p id="msgAuth" style="color: var(--neon-red); margin-top: 10px;"></p>
  </div>

  <!-- Módulo 2: Calculadora Premium (Oculta por defecto) -->
  <div id="panelCalculadora" class="cyber-panel rojo" style="display: none;">
    <h2>Calculadora Premium</h2>
    <p>Operador Activo: <span id="nombreOperador" style="color: var(--neon-blue);"></span></p>
    
    <select id="selEstilo" class="cyber-input">
      <option value="">Cargando metas desde base de datos...</option>
    </select>
    
    <input type="number" id="inpParos" class="cyber-input" placeholder="Minutos Totales de Paro">
    <input type="number" id="inpDocenas" class="cyber-input" placeholder="Total de Docenas Producidas">
    
    <button class="cyber-btn" onclick="procesarCalculo()">Calcular y Sincronizar</button>
    
    <div id="resultadoEficiencia">0.00%</div>
  </div>

</div>

<!-- LÓGICA JAVASCRIPT -->
<script>
  // ¡ATENCIÓN! Reemplaza esto con la URL que te dio Apps Script al "Implementar como aplicación web"
  const URL_APPS_SCRIPT = "TU_URL_DE_APPS_SCRIPT_AQUI"; 
  
  const EstadoApp = {
    usuario: null,
    token: null,
    metas: []
  };

  async function enviarPeticion(payload) {
    const response = await fetch(URL_APPS_SCRIPT, {
      method: 'POST',
      body: JSON.stringify(payload)
    });
    return await response.json();
  }

  async function iniciarSesion() {
    const token = document.getElementById('inpToken').value;
    const pin = document.getElementById('inpPin').value;
    const msg = document.getElementById('msgAuth');
    
    msg.innerText = "Autenticando en la red...";

    try {
      const data = await enviarPeticion({ accion: 'validar', token: token, pin: pin });
      
      if (data.valido) {
        EstadoApp.usuario = data.usuario;
        EstadoApp.token = data.token;
        
        document.getElementById('panelAuth').style.display = 'none';
        document.getElementById('panelCalculadora').style.display = 'block';
        document.getElementById('nombreOperador').innerText = data.usuario;
        
        cargarMetas();
      } else {
        msg.innerText = "Error: Credenciales denegadas.";
      }
    } catch (error) {
      msg.innerText = "Error de conexión con la matriz.";
    }
  }

  async function cargarMetas() {
    const select = document.getElementById('selEstilo');
    try {
      const data = await enviarPeticion({ accion: 'obtenerMetas' });
      if (data.status === "success") {
        EstadoApp.metas = data.data;
        select.innerHTML = '<option value="">-- Selecciona Estilo --</option>';
        EstadoApp.metas.forEach(meta => {
          if (meta.estilo) {
            select.innerHTML += `<option value="${meta.estilo}">${meta.estilo} (Meta base: ${meta.meta_por_hora})</option>`;
          }
        });
      }
    } catch (error) {
      select.innerHTML = '<option value="">Error al cargar metas</option>';
    }
  }

  async function procesarCalculo() {
    const estilo = document.getElementById('selEstilo').value;
    const paros = parseFloat(document.getElementById('inpParos').value) || 0;
    const docenas = parseFloat(document.getElementById('inpDocenas').value) || 0;
    
    if (!estilo) {
      alert("Debes seleccionar un estilo de la base de datos.");
      return;
    }

    const metaEstilo = EstadoApp.metas.find(m => m.estilo == estilo);
    
    // Cálculo de Turno (11 horas = 660 min)
    const MINUTOS_TURNO = 660;
    const tiempoEfectivo = MINUTOS_TURNO - paros;
    const metaAjustada = (metaEstilo.meta_por_hora / 60) * tiempoEfectivo;
    const eficiencia = (docenas / metaAjustada) * 100;
    const efiStr = eficiencia.toFixed(2) + '%';

    document.getElementById('resultadoEficiencia').innerText = efiStr;
    document.getElementById('resultadoEficiencia').style.color = (eficiencia >= 100) ? "var(--neon-blue)" : "var(--neon-red)";

    const payload = {
      accion: 'guardarPremium',
      datos: {
        usuarioToken: EstadoApp.token,
        estilo: estilo,
        metaPorHora: metaEstilo.meta_por_hora,
        parosMinutos: paros,
        totalDocenas: docenas,
        eficienciaResultante: efiStr
      }
    };

    // Sincronizar en segundo plano
    try {
      const respuesta = await enviarPeticion(payload);
      console.log("Cálculo sincronizado:", respuesta.message);
    } catch (e) {
      console.error("Fallo al sincronizar cálculo:", e);
    }
  }
</script>
